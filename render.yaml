# One-click: https://render.com/deploy?repo=https://github.com/titan717/api.secrets
services:
  - type: web
    name: secrets-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile=false && pnpm build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase: { name: secrets-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: secrets-redis, property: connectionString }
  - type: keyvalue
    name: secrets-redis
    plan: free
    ipAllowList: []
databases:
  - name: secrets-db
    plan: free
